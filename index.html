<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>名鉄グループ OA AIモード｜体験デモ</title>
<style>
:root{--ink:#16181d;--muted:#747984;--line:#e5e7ec;--p:#9227ef;--b:#2460ef;--c:#08bce5;--g:#06c755;--ease:cubic-bezier(.22,1,.36,1)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);background:#eee}button{font:inherit}button:not(:disabled){cursor:pointer}img{display:block;max-width:100%}.page{min-height:100dvh;display:grid;grid-template-rows:62px 1fr;overflow:hidden}.topbar{z-index:5;display:flex;align-items:center;gap:13px;padding:0 28px;background:#fffffff0;border-bottom:1px solid #ddd;backdrop-filter:blur(15px)}.line{background:var(--g);color:#fff;font-weight:800;border-radius:7px;padding:6px 9px}.topbar b{font-size:14px}.topbar small{margin-left:auto;color:var(--muted)}.tag{border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:10px}.stage{position:relative;display:grid;grid-template-columns:minmax(400px,1fr) minmax(520px,700px);gap:30px;align-items:center;padding:28px clamp(22px,5vw,80px) 34px;min-height:0}.life{position:absolute;inset:0;background:center/cover;z-index:-1;transition:.6s var(--ease)}.life:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#001813d4 0,#00181392 43%,#00181320 70%,#fff1)}.story{align-self:end;color:#fff;padding-bottom:55px;text-shadow:0 3px 25px #0005}.story small{font-size:17px}.story h1{font-size:clamp(40px,4.1vw,65px);line-height:1.4;margin:12px 0;font-weight:620}.story p{font-size:16px;line-height:1.8;max-width:560px;color:#ffffffd0}.wrap{position:relative;justify-self:end;width:min(680px,100%);height:min(840px,calc(100dvh - 108px))}.device{height:100%;background:#fff;border-radius:40px;box-shadow:0 30px 100px #0e193048;overflow:hidden;position:relative}.head{height:94px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:750;position:relative}.head .account{position:absolute;left:28px;font-size:12px;font-weight:500;color:#7a7f88}.head .x{position:absolute;right:27px;font-size:28px;font-weight:400}.head .n{position:absolute;right:67px;border:1.5px solid;width:23px;height:23px;display:grid;place-items:center;font-size:13px}.canvas{position:absolute;inset:94px 0 158px;padding:12px 28px 20px;overflow:auto;scrollbar-width:none}.canvas::-webkit-scrollbar{display:none}.view{animation:in .4s var(--ease)}.kicker{font-size:15px;color:#7b8089;margin:0 0 10px}.title{font-size:30px;line-height:1.42;margin:0 0 18px}.sub{font-size:18px;line-height:1.65;color:#717680}.hero{height:210px;border-radius:17px;overflow:hidden;position:relative;margin-bottom:17px}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 44%,#000a)}.hero b{position:absolute;left:21px;bottom:19px;color:#fff;font-size:27px;z-index:1}.menu{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:11px;display:flex;justify-content:space-between;text-align:left;font-size:21px}.menu span{color:#aaa}.panel{border:1px solid #e3e5ea;border-radius:18px;padding:21px;background:#fff;box-shadow:0 5px 18px #181b2d0a}.label{font-size:17px;color:#767c86;margin:0 0 13px}.choices{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.choice{border:1px solid #e0e3e8;background:#fff;border-radius:10px;padding:11px 17px;font-size:19px}.choice.selected{border-color:#7460e9;background:#f3f0ff;color:#5138d6}.rows{border-top:1px solid #eceef1}.row{display:flex;justify-content:space-between;gap:16px;padding:17px 0;border-bottom:1px solid #eceef1;font-size:20px}.row span{color:#7a8089}.row b{text-align:right;font-weight:570}.progress{height:6px;background:#edeef3;border-radius:5px;overflow:hidden;margin-top:18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--b),var(--c));animation:load 2.1s var(--ease) both}.cards-window{overflow:hidden;margin-right:-28px}.cards{display:flex;gap:17px;width:max-content;transition:.55s var(--ease)}.card{width:520px;border:1px solid #e2e4e9;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 7px 20px #14172b0f}.card img{width:100%;height:205px;object-fit:cover}.card-body{padding:20px}.badge{display:inline-block;background:#f2efff;color:#623bda;border-radius:5px;padding:5px 9px;font-size:15px;margin-bottom:10px}.card h2{font-size:27px;margin:0 0 8px}.card p{font-size:17px;color:#737983;line-height:1.6;margin:0 0 17px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;padding:15px 12px;color:#fff;background:linear-gradient(92deg,var(--p),var(--b) 64%,#159de8);font-weight:700;font-size:18px}.btn.secondary{background:#fff;color:#3d57d7;border:1px solid #4962df}.full{width:100%;margin-top:19px}.segments{display:flex;gap:7px;margin:17px 18px}.segments i{height:5px;flex:1;border-radius:5px;background:#e1e3e8}.segments i.active{background:linear-gradient(90deg,var(--p),var(--b))}.route{padding:17px 0 17px 39px;border-left:3px solid #6758e7;margin-left:14px;position:relative;font-size:22px}.route:before{content:"";position:absolute;left:-10px;top:22px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #6758e7}.route small{display:block;color:#7c818a;font-size:16px;margin-top:7px}.success{width:82px;height:82px;margin:10px auto 19px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:39px;background:linear-gradient(145deg,var(--p),var(--b),var(--c));box-shadow:0 12px 30px #444ae83f}.center{text-align:center}.dock{position:absolute;left:0;right:0;bottom:0;height:158px;background:linear-gradient(#fff0,#fff 20%);display:flex;justify-content:center;align-items:center;gap:66px;padding-bottom:32px}.round{width:62px;height:62px;border:1px solid #e6e8ed;background:#fff;border-radius:50%;font-size:28px}.orb{width:86px;height:86px;border:4px solid #fff;border-radius:50%;background:linear-gradient(145deg,var(--p),var(--b) 60%,var(--c));box-shadow:0 0 30px #4b43ee85;color:#fff;font-size:34px;position:relative}.status{position:absolute;bottom:21px;color:#7a7f88;font-size:17px}.homebar{position:absolute;bottom:7px;width:210px;height:5px;background:#111;border-radius:5px}.nav{position:absolute;right:-22px;top:50%;transform:translateY(-50%);display:grid;gap:9px}.nav button{width:44px;height:44px;border-radius:50%;border:1px solid #e3e5e9;background:#fff;box-shadow:0 8px 22px #161d2f21;font-size:20px}.nav button:disabled{opacity:.3}.auto{position:absolute;right:0;bottom:-29px;color:#fff;background:#03100e9e;border:1px solid #ffffff4d;border-radius:20px;padding:7px 12px;font-size:11px}.voice{position:absolute;inset:0;background:#fffffff7;z-index:12;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:.35s}.voice.show{opacity:1;pointer-events:auto}.voice .orb{margin:auto}.voice .orb:before,.voice .orb:after{content:"";position:absolute;inset:-12px;border:1px solid #5c48e980;border-radius:50%;animation:ripple 1.4s infinite}.voice .orb:after{animation-delay:.55s}.wave{height:38px;display:flex;gap:5px;align-items:center;justify-content:center;margin:20px}.wave i{width:5px;border-radius:5px;background:linear-gradient(var(--p),var(--b));animation:wave .58s infinite alternate}.wave i:nth-child(2n){animation-delay:.1s}.voice p{font-size:20px;color:#555c69;max-width:430px;min-height:64px;padding:0 20px}@keyframes in{from{opacity:0;transform:translateY(18px)}}@keyframes load{from{width:5%}to{width:100%}}@keyframes ripple{to{transform:scale(1.25);opacity:0}}@keyframes wave{from{height:10px}to{height:34px}}
@media(max-width:1000px){.stage{grid-template-columns:1fr;padding:18px}.story{display:none}.wrap{justify-self:center;width:min(680px,100%);height:calc(100dvh - 98px)}}@media(max-width:650px){.page{grid-template-rows:54px 1fr}.topbar{padding:0 12px}.topbar small,.tag{display:none}.stage{padding:0}.wrap{height:calc(100dvh - 54px);width:100%}.device{border-radius:0}.nav{right:50%;top:auto;bottom:8px;transform:translateX(50%);display:flex}.nav button{width:38px;height:38px}.auto{display:none}.canvas{padding-left:18px;padding-right:18px}.card{width:calc(100vw - 58px)}}
</style>
<style>
.stage{isolation:isolate}
.life{z-index:0}
.story,.wrap{position:relative;z-index:1}
@media(max-width:650px){.hero b{font-size:23px;right:14px}.head .account{left:16px}.dock{gap:52px}}

</head><body><main class="page"><header class="topbar"><span class="line">LINE</span><b>名鉄グループ OA AIモード</b><small>画面を操作して利用イメージを体験できます</small><span class="tag">CONCEPT DEMO</span></header><section class="stage"><div class="life" id="life"></div><div class="story"><small id="lead"></small><h1 id="copy"></h1><p id="body"></p></div><div class="wrap"><div class="device"><header class="head"><span class="account">名鉄グループ</span>AIモード<span class="n">1</span><span class="x">×</span></header><div class="canvas" id="canvas"></div><div class="dock"><button class="round" id="reset">×</button><button class="orb" id="mic">✦</button><button class="round" id="voiceBtn">♩</button><span class="status" id="status">ご案内中…</span><span class="homebar"></span></div><div class="voice" id="voice"><div><button class="orb" id="finish">✦</button><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><b>お話しください</b><p id="transcript"></p></div></div></div><nav class="nav"><button id="prev">‹</button><button id="next">›</button></nav><button class="auto" id="auto">▶ 自動再生</button></div></section></main>
<script>
const A={train:'assets/train-trip.jpg',park:'assets/monkeypark-aerial.jpg',world:'assets/littleworld-child.jpg',hotel:'assets/hotel-inuyama-window.webp'};
const steps=[['home','いつものLINEから','AIモードへ。','話しかけるところから、週末の計画が始まります。',A.train],['listen','音声で相談','希望を、話す。','「家族で犬山へ。母も一緒に、ゆっくり。」',A.train],['stay','会話に合わせて','条件が、形になる。','一泊、大人2人・小学生2人・シニア1人。',A.train],['prefs','家族それぞれの希望','ひとつの条件へ。','遊園地、景色、食事。休憩を取りやすい過ごし方。',A.park],['profile','OA AIモードが整理','名鉄グループを、まとめて。','施設・宿泊・経路を横断し、家族に合うプランを生成します。',A.park],['plans','おすすめがカードで届く','比べて、選ぶ。','横にスワイプして、家族に合うプランを比較できます。',A.park],['hotel','会話した希望を引き継ぐ','泊まる場所まで、一緒に。','景色と食事を楽しめる宿泊プランへ。',A.hotel],['route','選んだ内容から','予定が、ひとつに。','遊び・宿泊・移動がひとつの行程になります。',A.hotel],['apply','各社の手続きへ','相談から、申し込みへ。','選んだ条件を保ったまま、チケットや予約の確認へ進みます。',A.hotel],['saved','おでかけ当日も','出発前に、ひと目で。','行程、チケット、宿泊予約をLINEから確認できます。',A.train]];
const $=x=>document.getElementById(x),canvas=$('canvas');let current=0,plan=0,timer=null,voiceTimer;
const rows=xs=>`<div class="rows">${xs.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`,choice=(x,on=false)=>`<button class="choice${on?' selected':''}">${on?'✓ ':''}${x}</button>`,menu=x=>`<button class="menu">${x}<span>›</span></button>`;
function home(){return `<div class="view"><div class="hero"><img src="${A.train}"><b>名鉄グループ AIコンシェルジュ</b></div>${['おでかけを相談','旅行・宿泊を探す','行き方を調べる','保存したプラン'].map(menu).join('')}</div>`}function listen(){return `<div class="view"><p class="kicker">音声で相談</p><h2 class="title">週末、家族で犬山へ。<br>母も一緒なので、ゆっくり。</h2><div class="panel"><p class="label">AIが理解したこと</p><div class="choices">${['犬山','家族5人','シニア同行','ゆったり'].map(x=>choice(x,true)).join('')}</div><p class="sub">希望を整理し、必要な条件を確認します。</p></div></div>`}function stay(){return `<div class="view"><p class="kicker">おでかけの条件</p><h2 class="title">ご家族の予定を教えてください。</h2><div class="panel"><p class="label">滞在日数</p><div class="choices">${choice('日帰り')}${choice('一泊',true)}</div><p class="label">同行される方</p>${rows([['大人','2人'],['小学生','2人'],['シニア','1人']])}</div></div>`}function prefs(){return `<div class="view"><p class="kicker">楽しみたいこと</p><h2 class="title">家族それぞれの希望に合わせて。</h2><div class="panel"><p class="label">お子さま</p><div class="choices">${choice('遊園地',true)}${choice('生きもの')}</div><p class="label">お母さま</p><div class="choices">${choice('景色',true)}${choice('食事',true)}</div><p class="label">過ごし方</p><div class="choices">${choice('ゆったり',true)}${choice('アクティブ')}</div></div></div>`}function profile(){return `<div class="view"><p class="kicker">ご希望の整理</p><h2 class="title">家族で楽しむ、犬山1泊2日。</h2><div class="panel">${rows([['同行者','大人2人・小学生2人・シニア1人'],['子どもの楽しみ','遊園地'],['お母さまの楽しみ','景色・食事'],['過ごし方','ゆったり']])}<p class="sub" style="margin:18px 0 0">施設・宿泊・経路を検索しています</p><div class="progress"><i></i></div></div></div>`}
const plansData=[['A',A.park,'遊園地で、思いきり。','日本モンキーパーク＋犬山の宿','子どもが楽しめる遊びと、休憩をはさんだ1泊2日。'],['B',A.world,'世界の文化と、食を。','リトルワールド＋犬山の宿','世界の暮らしと食を楽しむ、ゆったりした1泊2日。']];function planCard(p){return `<article class="card"><img src="${p[1]}"><div class="card-body"><span class="badge">プラン${p[0]}　犬山1泊2日</span><h2>${p[2]}</h2><p>${p[3]}<br>${p[4]}</p><div class="actions"><button class="btn secondary">詳しく見る</button><button class="btn choose">このプランへ</button></div></div></article>`}function plans(){return `<div class="view"><p class="kicker">ご家族に合わせた、おすすめプラン</p><div class="cards-window"><div class="cards" style="transform:translateX(${-537*plan}px)">${plansData.map(planCard).join('')}</div></div><div class="segments"><i class="${plan===0?'active':''}"></i><i class="${plan===1?'active':''}"></i></div></div>`}function hotel(){return `<div class="view"><p class="kicker">宿泊の候補</p><article class="card" style="width:100%"><img src="${A.hotel}" style="height:250px"><div class="card-body"><span class="badge">名鉄ホテルズ</span><h2>景色を楽しむ、犬山の宿</h2><p>家族でゆったり過ごす一泊。お部屋と食事のプランを確認。</p><button class="btn full">この宿泊プランを見る</button></div></article></div>`}function route(){return `<div class="view"><p class="kicker">選択したプラン</p><h2 class="title">遊ぶ。泊まる。移動する。</h2><div class="panel"><div class="route"><b>日本モンキーパーク</b><small>子どもと楽しむ、遊園地</small></div><div class="route"><b>犬山のホテルへ</b><small>休憩して、景色と食事を</small></div><div class="route"><b>翌日は、ゆったり散策</b><small>ご家族のペースで</small></div><button class="btn full">手続きに進む</button></div></div>`}function apply(){return `<div class="view"><p class="kicker">チケットのお申し込み</p><h2 class="title">内容を確認して、次へ。</h2><div class="panel"><span class="badge">名鉄インプレス</span>${rows([['施設','日本モンキーパーク'],['ご利用日','選択した週末'],['人数','大人3人・小学生2人']])}<p class="sub" style="margin:18px 0">料金・利用条件は申込先でご確認ください。</p><button class="btn full">申込サイトで確認する</button></div></div>`}function saved(){return `<div class="view center"><div class="success">✓</div><h2 class="title">プランを保存しました</h2><p class="sub">出発前も、LINEから確認できます。</p><div class="panel" style="margin-top:22px;text-align:left">${rows([['プラン','犬山1泊2日'],['遊び','日本モンキーパーク'],['宿泊','選択したホテル']])}<button class="btn full">今日のプランを開く</button></div></div>`}
const views={home,listen,stay,prefs,profile,plans,hotel,route,apply,saved};function render(){const s=steps[current];canvas.innerHTML=views[s[0]]();$('life').style.backgroundImage=`url('${s[4]}')`;$('lead').textContent=s[1];$('copy').textContent=s[2];$('body').textContent=s[3];$('prev').disabled=current===0;$('next').disabled=current===steps.length-1;$('status').textContent=s[0]==='profile'?'検索中…':s[0]==='saved'?'保存しました':'ご案内中…';canvas.scrollTop=0;bind()}function bind(){canvas.querySelectorAll('.choice').forEach(x=>x.onclick=()=>x.classList.toggle('selected'));canvas.querySelectorAll('.menu,.choose,.full').forEach(x=>x.onclick=()=>go(1));if(steps[current][0]==='plans'){let sx=0;const w=canvas.querySelector('.cards-window');w.onpointerdown=e=>sx=e.clientX;w.onpointerup=e=>{if(Math.abs(e.clientX-sx)>35){plan=e.clientX<sx?1:0;render()}}}}function stop(){clearInterval(timer);timer=null;$('auto').textContent='▶ 自動再生'}function go(n){stop();current=Math.max(0,Math.min(steps.length-1,current+n));render()}$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('reset').onclick=()=>{current=0;render()};function startVoice(){stop();$('voice').classList.add('show');$('transcript').textContent='';const t='週末、家族で犬山へ。母も一緒なので、ゆっくり楽しみたい。';let i=0;voiceTimer=setInterval(()=>{$('transcript').textContent=t.slice(0,++i);if(i>=t.length){clearInterval(voiceTimer);setTimeout(()=>{$('voice').classList.remove('show');current=1;render()},600)}},45)}$('mic').onclick=startVoice;$('voiceBtn').onclick=startVoice;$('finish').onclick=()=>{clearInterval(voiceTimer);$('voice').classList.remove('show')};$('auto').onclick=()=>{if(timer){stop();return}current=0;render();$('auto').textContent='Ⅱ 停止';timer=setInterval(()=>{if(current===steps.length-1)stop();else{current++;render()}},5200)};render();
</script></body></html>
